<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Academic Works</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <div><h1>📚 My Academic Works</h1><p>Quizzes, exams, activities and projects</p></div>
  <div id="authBox"><button id="loginBtn">Owner Login</button></div>
</header>
<nav id="tabs"></nav>
<main>
  <section id="adminPanel" hidden>
    <h2>Add new work to <span id="catName"></span></h2>
    <input id="title" placeholder="Title (e.g. Quiz 1 - Algebra)">
    <textarea id="desc" placeholder="Description / score / notes"></textarea>
    <input type="file" id="file">
    <button id="uploadBtn">Upload</button>
    <button id="pwBtn" class="ghost">Change email/password</button>
  </section>
  <div id="grid"></div>
</main>
<div id="loginModal" class="modal" hidden>
  <div class="box">
    <h2>Owner Login</h2>
    <input id="email" type="email" placeholder="Email">
    <input id="pass" type="password" placeholder="Password">
    <p id="err"></p>
    <button id="doLogin">Login</button> <button class="ghost" id="closeLogin">Cancel</button>
  </div>
</div>
<div id="viewer" class="modal" hidden><img id="bigImg" alt=""></div>
<script src="js/app.js"></script>
</body>
</html>
